# Nạp biến bí mật từ file .env ở thư mục gốc project (không commit lên Git).
# Biến môi trường của hệ điều hành vẫn được ưu tiên hơn file .env.
# Xem .env.example để biết cần khai báo những biến nào.
spring.config.import=optional:file:.env[.properties]

# Server
server.port=8080
spring.application.name=library-api

# Cấu hình Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA (chỉ validate vì Liquibase sẽ tạo bảng)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình Liquibase
spring.liquibase.change-log=classpath:db/changelog-master.yaml
spring.liquibase.enabled=true

# Cấu hình Mail (Sử dụng Mailtrap.io để test)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cấu hình JWT Custom
# Bắt buộc khai báo JWT_SECRET (>= 32 ký tự). Không có giá trị mặc định để tránh chạy nhầm với khóa lộ công khai.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=3600000
app.jwt.refresh-token-expiration=86400000

# Upload file
spring.servlet.multipart.enabled=true

# Giới hạn chung đủ để nhận PDF tối đa 30 MB
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB

# Thư mục lưu file ebook
library.ebook.storage-dir=./data/ebooks

# Giới hạn nghiệp vụ được kiểm tra riêng trong từng service
library.ebook.max-file-size=30MB
library.import.max-file-size=5MB

# Debug API nếu cần
# logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE