databaseChangeLog:
  - changeSet:
      id: 024-add-expanded-permissions
      author: thanh
      changes:
        - sql:
            sql: |
              -- 13 quyền mới, không sửa các changeset đã chạy.
              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'CATEGORY_READ', 'Xem danh mục sách', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'CATEGORY_READ');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'CATEGORY_CREATE', 'Tạo danh mục sách', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'CATEGORY_CREATE');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'CATEGORY_UPDATE', 'Cập nhật danh mục sách', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'CATEGORY_UPDATE');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'CATEGORY_DELETE', 'Xóa danh mục sách', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'CATEGORY_DELETE');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'MEMBER_EXPORT', 'Xuất danh sách thành viên', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'MEMBER_EXPORT');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'BORROW_CANCEL', 'Hủy yêu cầu mượn sách giấy đang chờ xử lý', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'BORROW_CANCEL');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'BORROW_CONFIRM_RETURN', 'Xác nhận nhận lại sách giấy', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'BORROW_CONFIRM_RETURN');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'REPORT_READ', 'Xem báo cáo thống kê', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'REPORT_READ');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'REPORT_EXPORT', 'Xuất báo cáo thống kê', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'REPORT_EXPORT');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'PERMISSION_GROUP_READ', 'Xem danh sách và chi tiết nhóm quyền', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'PERMISSION_GROUP_READ');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'PERMISSION_GROUP_CREATE', 'Tạo nhóm quyền', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'PERMISSION_GROUP_CREATE');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'PERMISSION_GROUP_UPDATE', 'Cập nhật nhóm quyền và người dùng trong nhóm', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'PERMISSION_GROUP_UPDATE');

              INSERT INTO permissions (name, description, created_at, updated_at)
              SELECT 'PERMISSION_GROUP_DELETE', 'Xóa nhóm quyền', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE name = 'PERMISSION_GROUP_DELETE');

              -- ROLE_ADMIN nhận đủ 13 quyền mới.
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id
              FROM roles r
              JOIN permissions p ON p.name IN (
                'CATEGORY_READ', 'CATEGORY_CREATE', 'CATEGORY_UPDATE', 'CATEGORY_DELETE',
                'MEMBER_EXPORT',
                'BORROW_CANCEL', 'BORROW_CONFIRM_RETURN',
                'REPORT_READ', 'REPORT_EXPORT',
                'PERMISSION_GROUP_READ', 'PERMISSION_GROUP_CREATE',
                'PERMISSION_GROUP_UPDATE', 'PERMISSION_GROUP_DELETE'
              )
              WHERE r.name = 'ROLE_ADMIN'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions existing
                  WHERE existing.role_id = r.id
                    AND existing.permission_id = p.id
                );

              -- CATEGORY_READ kế thừa các Role đang có BOOK_READ.
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT DISTINCT old_rp.role_id, new_p.id
              FROM role_permissions old_rp
              JOIN permissions old_p
                ON old_p.id = old_rp.permission_id
               AND old_p.name = 'BOOK_READ'
              JOIN permissions new_p
                ON new_p.name = 'CATEGORY_READ'
              WHERE NOT EXISTS (
                SELECT 1 FROM role_permissions existing
                WHERE existing.role_id = old_rp.role_id
                  AND existing.permission_id = new_p.id
              );

              -- BORROW_CONFIRM_RETURN kế thừa các Role đang có BORROW_RETURN.
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT DISTINCT old_rp.role_id, new_p.id
              FROM role_permissions old_rp
              JOIN permissions old_p
                ON old_p.id = old_rp.permission_id
               AND old_p.name = 'BORROW_RETURN'
              JOIN permissions new_p
                ON new_p.name = 'BORROW_CONFIRM_RETURN'
              WHERE NOT EXISTS (
                SELECT 1 FROM role_permissions existing
                WHERE existing.role_id = old_rp.role_id
                  AND existing.permission_id = new_p.id
              );

              -- Giữ nguyên quyền tương ứng trong các nhóm quyền.
              INSERT INTO permission_group_permissions (group_id, permission_id)
              SELECT DISTINCT old_gp.group_id, new_p.id
              FROM permission_group_permissions old_gp
              JOIN permissions old_p
                ON old_p.id = old_gp.permission_id
               AND old_p.name = 'BOOK_READ'
              JOIN permissions new_p
                ON new_p.name = 'CATEGORY_READ'
              WHERE NOT EXISTS (
                SELECT 1 FROM permission_group_permissions existing
                WHERE existing.group_id = old_gp.group_id
                  AND existing.permission_id = new_p.id
              );

              INSERT INTO permission_group_permissions (group_id, permission_id)
              SELECT DISTINCT old_gp.group_id, new_p.id
              FROM permission_group_permissions old_gp
              JOIN permissions old_p
                ON old_p.id = old_gp.permission_id
               AND old_p.name = 'BORROW_RETURN'
              JOIN permissions new_p
                ON new_p.name = 'BORROW_CONFIRM_RETURN'
              WHERE NOT EXISTS (
                SELECT 1 FROM permission_group_permissions existing
                WHERE existing.group_id = old_gp.group_id
                  AND existing.permission_id = new_p.id
              );

              -- Sao chép cả override cấp cá nhân, bao gồm granted = false.
              INSERT INTO user_permission_overrides
                (user_id, permission_id, granted, created_at, updated_at)
              SELECT old_override.user_id, new_p.id, old_override.granted,
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM user_permission_overrides old_override
              JOIN permissions old_p
                ON old_p.id = old_override.permission_id
               AND old_p.name = 'BOOK_READ'
              JOIN permissions new_p
                ON new_p.name = 'CATEGORY_READ'
              WHERE NOT EXISTS (
                SELECT 1 FROM user_permission_overrides existing
                WHERE existing.user_id = old_override.user_id
                  AND existing.permission_id = new_p.id
              );

              INSERT INTO user_permission_overrides
                (user_id, permission_id, granted, created_at, updated_at)
              SELECT old_override.user_id, new_p.id, old_override.granted,
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM user_permission_overrides old_override
              JOIN permissions old_p
                ON old_p.id = old_override.permission_id
               AND old_p.name = 'BORROW_RETURN'
              JOIN permissions new_p
                ON new_p.name = 'BORROW_CONFIRM_RETURN'
              WHERE NOT EXISTS (
                SELECT 1 FROM user_permission_overrides existing
                WHERE existing.user_id = old_override.user_id
                  AND existing.permission_id = new_p.id
              );