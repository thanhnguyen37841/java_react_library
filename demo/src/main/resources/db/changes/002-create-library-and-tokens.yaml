databaseChangeLog:
  - changeSet:
      id: 2
      author: dev
      changes:
        - createTable:
            tableName: categories
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: description, type: VARCHAR(500) }
              - column: { name: created_at, type: DATETIME }
              - column: { name: updated_at, type: DATETIME }
        
        - createTable:
            tableName: books
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: title, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: author, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: total_quantity, type: INT, constraints: { nullable: false } }
              - column: { name: available_quantity, type: INT, constraints: { nullable: false } }
              - column: { name: category_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: created_at, type: DATETIME }
              - column: { name: updated_at, type: DATETIME }
        - addForeignKeyConstraint: { baseTableName: books, baseColumnNames: category_id, referencedTableName: categories, referencedColumnNames: id, constraintName: fk_books_category_id }

        - createTable:
            tableName: borrow_records
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: member_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: book_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: borrow_date, type: DATE, constraints: { nullable: false } }
              - column: { name: return_date, type: DATE }
              - column: { name: status, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: created_at, type: DATETIME }
              - column: { name: updated_at, type: DATETIME }
        - addForeignKeyConstraint: { baseTableName: borrow_records, baseColumnNames: member_id, referencedTableName: members, referencedColumnNames: id, constraintName: fk_borrow_member_id }
        - addForeignKeyConstraint: { baseTableName: borrow_records, baseColumnNames: book_id, referencedTableName: books, referencedColumnNames: id, constraintName: fk_borrow_book_id }

        - createTable:
            tableName: system_configs
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: config_key, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: config_value, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: created_at, type: DATETIME }
              - column: { name: updated_at, type: DATETIME }

        - createTable:
            tableName: revoked_tokens
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: jti, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: expiry_date, type: DATETIME, constraints: { nullable: false } }
              - column: { name: created_at, type: DATETIME }
              - column: { name: updated_at, type: DATETIME }

        - createTable:
            tableName: refresh_tokens
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: token, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: expiry_date, type: DATETIME, constraints: { nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: created_at, type: DATETIME }
              - column: { name: updated_at, type: DATETIME }
        - addForeignKeyConstraint: { baseTableName: refresh_tokens, baseColumnNames: user_id, referencedTableName: users, referencedColumnNames: id, constraintName: fk_refresh_tokens_user_id }

        - createTable:
            tableName: verification_tokens
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: token, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: expiry_date, type: DATETIME, constraints: { nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: created_at, type: DATETIME }
              - column: { name: updated_at, type: DATETIME }
        - addForeignKeyConstraint: { baseTableName: verification_tokens, baseColumnNames: user_id, referencedTableName: users, referencedColumnNames: id, constraintName: fk_verification_tokens_user_id }

        - createTable:
            tableName: password_reset_tokens
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: token, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: expiry_date, type: DATETIME, constraints: { nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: created_at, type: DATETIME }
              - column: { name: updated_at, type: DATETIME }
        - addForeignKeyConstraint: { baseTableName: password_reset_tokens, baseColumnNames: user_id, referencedTableName: users, referencedColumnNames: id, constraintName: fk_password_reset_tokens_user_id }