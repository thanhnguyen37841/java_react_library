  # CHANGESET MỚI: thêm quyền BORROW_READ
  - changeSet:
      id: 16
      author: dev
      changes:
        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: BORROW_READ
              - column:
                  name: description
                  value: "Xem, tìm kiếm và phân trang phiếu mượn"

  # CHANGESET MỚI: gán BORROW_READ cho ROLE_ADMIN
  - changeSet:
      id: 17
      author: dev
      changes:
        - sql:
            sql: |
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id
              FROM roles r
              CROSS JOIN permissions p
              WHERE r.name = 'ROLE_ADMIN'
                AND p.name = 'BORROW_READ'
                AND NOT EXISTS (
                    SELECT 1
                    FROM role_permissions rp
                    WHERE rp.role_id = r.id
                      AND rp.permission_id = p.id
                );
