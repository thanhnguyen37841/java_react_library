
databaseChangeLog:
  - changeSet:
      id: 9
      author: dev
      changes:
        - createTable:
            tableName: user_permission_overrides
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: granted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME

              - column:
                  name: updated_at
                  type: DATETIME

        - addPrimaryKey:
            tableName: user_permission_overrides
            columnNames: user_id, permission_id
            constraintName: pk_user_permission_overrides

        - addForeignKeyConstraint:
            baseTableName: user_permission_overrides
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_permission_overrides_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: user_permission_overrides
            baseColumnNames: permission_id
            referencedTableName: permissions
            referencedColumnNames: id
            constraintName: fk_user_permission_overrides_permission
            onDelete: CASCADE
