databaseChangeLog:
  - changeSet:
      id: 025-add-soft-delete-categories
      author: thanh
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: categories
              columnName: is_deleted
      changes:
        - addColumn:
            tableName: categories
            columns:
              - column:
                  name: is_deleted
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: deleted_at
                  type: DATETIME